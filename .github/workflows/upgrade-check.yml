name: V3.11 upgrade checks
on:
  push:
    branches: [agent/v3-11-wifi-dashboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart tool/check_pairing.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
