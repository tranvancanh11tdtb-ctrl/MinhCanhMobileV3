name: Install MinhCanhMobileV3 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack application source
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/minhcanh.zip
          unzip -q /tmp/minhcanh.zip -d /tmp/minhcanh
          cp -R /tmp/minhcanh/MinhCanhMobileV3/. .
          rm -f .github/workflows/build-apk.yml
      - name: Commit application source
        shell: bash
        run: |
          git config user.name "MinhCanhMobile Builder"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Install Minh Canh Mobile Flutter source"
          git push


