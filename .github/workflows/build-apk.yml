name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Fix Flutter source compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/main.dart')
          text = source.read_text(encoding='utf-8')
          replacements = [
              ("import 'package:path/path.dart';", "import 'package:path/path.dart' as p;"),
              ("final file = join(", "final file = p.join("),
              ("\n          value: product?['id'] as int?,", "\n          initialValue: product?['id'] as int?,"),
              ("DropdownButtonFormField<String>(value: payment", "DropdownButtonFormField<String>(initialValue: payment"),
              ("labelText: 'Chọn hàng còn tồn'), value:", "labelText: 'Chọn hàng còn tồn'), initialValue:"),
              ("labelText: 'Chọn IMEI *'), value:", "labelText: 'Chọn IMEI *'), initialValue:"),
              ("DropdownButtonFormField<int>(value: warranty", "DropdownButtonFormField<int>(initialValue: warranty"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          source.write_text(text, encoding='utf-8')
          PY

      - name: Save source fix
        shell: bash
        run: |
          git config user.name "MinhCanhMobile Builder"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet || git commit -m "Fix Flutter source compatibility"
          git push

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms android --org vn.minhcanhmobile .

      - name: Install dependencies
        run: flutter pub get

      - name: Check source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhCanhMobileV3-APK
          path: build/app/outputs/flutter-apk/app-release.apk
