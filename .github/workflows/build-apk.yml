name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/in-chia-se-phieu

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Fix Flutter source compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/main.dart')
          text = source.read_text(encoding='utf-8')
          replacements = [
              ("import 'package:path/path.dart';", "import 'package:path/path.dart' as p;"),
              ("final file = join(", "final file = p.join("),
              ("\n          value: product?['id'] as int?,", "\n          initialValue: product?['id'] as int?,"),
              ("DropdownButtonFormField<String>(value: payment", "DropdownButtonFormField<String>(initialValue: payment"),
              ("labelText: 'Chọn hàng còn tồn'), value:", "labelText: 'Chọn hàng còn tồn'), initialValue:"),
              ("labelText: 'Chọn IMEI *'), value:", "labelText: 'Chọn IMEI *'), initialValue:"),
              ("DropdownButtonFormField<int>(value: warranty", "DropdownButtonFormField<int>(initialValue: warranty"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          source.write_text(text, encoding='utf-8')
          PY

      - name: Save source fix
        shell: bash
        run: |
          git config user.name "MinhCanhMobile Builder"
          git config user.email "actions@users.noreply.github.com"
          git add lib/main.dart
          if ! git diff --cached --quiet; then
            git commit -m "Fix Flutter source compatibility"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              git push
            fi
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms android --org vn.minhcanhmobile .

      - name: Configure Android printer permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = '''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          '''
          if 'android.permission.BLUETOOTH_CONNECT' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permissions)
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Check source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhCanhMobileV3-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare Android APK signer
        shell: bash
        run: |
          build_tools_path="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools_path/apksigner"
          test -f "$build_tools_path/lib/apksigner.jar"
          mkdir -p build/apksigner/lib
          cp "$build_tools_path/apksigner" build/apksigner/
          cp "$build_tools_path/lib/apksigner.jar" build/apksigner/lib/

      - name: Save Android APK signer
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Signer
          path: build/apksigner
