name: V3.13 finance checks and APK

on:
  push:
    branches:
      - agent/v3-13-capital-guard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Verify LAN pairing
        run: dart tool/check_pairing.dart
      - name: Unit and widget tests
        run: flutter test
      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-fatal-infos
      - name: Generate Android and web projects
        run: flutter create --platforms android,web --org vn.minhcanhmobile --project-name minh_canh_mobile_v3 .
      - name: Build integrated desktop web assets
        run: flutter build web --release --no-web-resources-cdn
      - name: Add LAN service, Android permissions and embedded web assets
        run: python3 tool/configure_android.py
      - name: Isolate TEST app from installed production app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          source = gradle.read_text(encoding='utf-8')
          original = 'applicationId = "vn.minhcanhmobile.minh_canh_mobile_v3"'
          replacement = 'applicationId = "vn.minhcanhmobile.minh_canh_mobile_v3.test"'
          if source.count(original) != 1:
              raise SystemExit('Cannot safely isolate TEST package; expected applicationId not found exactly once')
          gradle.write_text(source.replace(original, replacement), encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          if xml.count('android:label="Minh Cảnh Mobile"') != 1:
              raise SystemExit('Cannot find TEST app label')
          manifest.write_text(xml.replace('android:label="Minh Cảnh Mobile"', 'android:label="Minh Cảnh TEST"'), encoding='utf-8')
          print('Built under separate application ID; user data of original app is not shared.')
          PY
      - name: Resolve packages after embedding assets
        run: flutter pub get
      - name: Build Android test APK
        run: flutter build apk --release
      - name: Verify APK signature and package
        shell: bash
        run: |
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          "$tools_dir/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | head -n 3
          "$tools_dir/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "package: name='vn.minhcanhmobile.minh_canh_mobile_v3.test'"
      - name: Upload V3.13 test APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhCanhMobileV313-SIDE-BY-SIDE-TEST-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
